/* Layout: a narrow single column for candidates; list plus detail panes for the hiring team. */

* { box-sizing: border-box; }
body {

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }

.btn {

.btn:hover { border-color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 6px; }

.scale input, .opt input { position: absolute; opacity: 0; pointer-events: none; }
.scale label {
  border: 1px solid var(--line); border-radius: 6px; min-height: 44px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-family: var(--font-data); font-weight: 700; background: var(--surface);
}
.scale label:hover { border-color: var(--accent); }
.scale input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.scale-ends { display: flex; justify-content: space-between; max-width: 460px; font-size: 12px; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { position: relative; }
.opt label { display: block; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; background: var(--surface); }
.opt label:hover { border-color: var(--accent); }
.opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 18px; }

/* admin */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; background: transparent; padding: 10px 16px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }

.stat { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-weight: 700; }
.fit-good { color: var(--good); } .fit-mid { color: var(--warn); } .fit-low { color: var(--danger); }

.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.meter { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; margin-top: 6px; }

.meter .t { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--target); border-radius: 1px; transform: translateX(-1px); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }

.legend i.t { width: 3px; height: 12px; background: var(--target); border-radius: 1px; vertical-align: -2px; }

.slider-row { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 12px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; }
@media (prefers-reduced-motion: reduce) { .progress .fill { transition: none; } }

/* Core: helpers, plan building, scoring, capability setup. */
const D = window.DATA;
const App = {
  caps: { db: null, user: null, downloads: null },
  uid: null,
  isAdmin: false,
  target: JSON.parse(JSON.stringify(D.defaultTarget)),
  results: null,
  state: { view: "loading", track: null, name: "", ident: "", page: 0, ans: { p: [], c: [], a: [] }, deadline: 0, secs: 0, err: "", busy: false },
  admin: { tab: "results", filter: "all", sel: null, confirmDel: null, draftTarget: null }
};

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r) => (r || document).querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtSecs = (s) => Math.floor(s / 60) + "分" + pad(s % 60) + "秒";

function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

/* Items are shown interleaved across dimensions so that neighbours measure different things. */
function interleave(items) {
  const groups = {}, order = [];
  items.forEach((it, i) => { if (!groups[it.d]) { groups[it.d] = []; order.push(it.d); } groups[it.d].push(i); });
  const out = []; let n = 0, more = true;
  while (more) { more = false; order.forEach((d) => { if (groups[d][n] !== undefined) { out.push(groups[d][n]); more = true; } }); n++; }
  return out;
}
function chunk(arr, size) { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; }

function buildPlan(track) {
  const c = D.culture.common.concat(D.culture[track]);
  const a = D.ability[track].items;
  const pages = [];
  chunk(interleave(D.personality), 5).forEach((ix) => pages.push({ kind: "p", part: "性格", ix }));
  chunk(interleave(c), 7).forEach((ix) => pages.push({ kind: "c", part: "価値観", ix }));
  chunk(a.map((_, i) => i), 4).forEach((ix) => pages.push({ kind: "a", part: "能力", ix }));
  return { p: D.personality, c, a, pages };
}

function cultureDimsFor(track) { return D.cultureDims.common.concat(D.cultureDims[track] || []); }

function scoreScale(items, ans, dimKeys) {
  const out = {};
  dimKeys.forEach((k) => {
    let sum = 0, n = 0;
    items.forEach((it, i) => { if (it.d !== k) return; const x = ans[i]; sum += it.r ? 6 - x : x; n++; });
    out[k] = n ? Math.round(((sum / n) - 1) * 25) : null;
  });
  return out;
}

function scoreAbility(items, ans) {
  const s = D.abilitySections.map(() => 0), n = D.abilitySections.map(() => 0);
  items.forEach((it, i) => { const k = D.abilitySections.indexOf(it.s); n[k]++; if (ans[i] === it.a) s[k]++; });
  return { s, n };
}

function targetFor(track) { return Object.assign({}, D.defaultTarget[track], (App.target && App.target[track]) || {}); }

/* Closeness to the target profile: 100 minus the mean absolute gap across the culture dimensions. */
function fitScore(doc) {
  const t = targetFor(doc.track), dims = cultureDimsFor(doc.track);
  let sum = 0, n = 0;
  dims.forEach((d) => { if (doc.c && doc.c[d.k] != null && t[d.k] != null) { sum += Math.abs(doc.c[d.k] - t[d.k]); n++; } });
  return n ? Math.round(100 - sum / n) : null;
}
const fitClass = (f) => (f == null ? "" : f >= 80 ? "fit-good" : f >= 65 ? "fit-mid" : "fit-low");
const abilityTotal = (doc) => (doc.ab ? doc.ab.s.reduce((a, b) => a + b, 0) : 0);
const abilityMax = (doc) => (doc.ab ? doc.ab.n.reduce((a, b) => a + b, 0) : 0);

function withTimeout(p, ms) { return Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]); }

async function initCaps() {
  const use = (n) => (window.claude && window.claude.use ? withTimeout(window.claude.use(n).catch(() => null), 5000) : Promise.resolve(null));
  const [db, user, downloads] = await Promise.all([use("db"), use("user"), use("downloads")]);
  App.caps = { db, user, downloads };
  if (user) {
    try { App.isAdmin = !!(await user.canEdit()); } catch (e) { App.isAdmin = false; }
    try { App.uid = await user.id(); } catch (e) { App.uid = null; }
  }
}

function pageNumberBase(plan, kind, page) {
  let n = 0;
  for (let i = 0; i < page; i++) if (plan.pages[i].kind === kind) n += plan.pages[i].ix.length;
  return n;
}

function pageComplete() {
  const S = App.state, pg = S.plan.pages[S.page];
  return pg.ix.every((i) => S.ans[pg.kind][i] != null);
}

function renderTest() {
  const S = App.state, plan = S.plan, pg = plan.pages[S.page], total = plan.pages.length;
  const parts = ["性格", "価値観", "能力"];
  const phases = '<div class="phases">' + parts.map((p) => (p === pg.part ? "<b>" + p + "</b>" : "<span>" + p + "</span>")).join("") + "</div>";
  const timer = pg.kind === "a" ? '<div class="timer" id="timer" aria-live="off">' + fmtClock(remaining()) + "</div>" : "";
  const base = pageNumberBase(plan, pg.kind, S.page);
  let body = "";
  pg.ix.forEach((i, n) => {
    const num = base + n + 1;
    if (pg.kind === "a") {
      const it = plan.a[i];
      body += '<div class="q"><div class="q-tag">' + esc(it.s) + " " + num + '</div><div class="q-text">' + esc(it.q) + '</div><div class="opts" role="radiogroup">' +
        it.o.map((o, k) => '<div class="opt"><input type="radio" name="a:' + i + '" id="a-' + i + "-" + k + '" value="' + k + '"' + (S.ans.a[i] === k ? " checked" : "") + '><label for="a-' + i + "-" + k + '">' + esc(o) + "</label></div>").join("") + "</div></div>";
    } else {
      const it = plan[pg.kind][i];
      body += '<div class="q"><div class="q-tag">Q' + num + '</div><div class="q-text">' + esc(it.t) + '</div><div class="scale" role="radiogroup" aria-label="Q' + num + '">' +
        [1, 2, 3, 4, 5].map((v) => '<input type="radio" name="' + pg.kind + ":" + i + '" id="' + pg.kind + "-" + i + "-" + v + '" value="' + v + '"' + (S.ans[pg.kind][i] === v ? " checked" : "") + '><label for="' + pg.kind + "-" + i + "-" + v + '" title="' + D.likert[v - 1] + '">' + v + "</label>").join("") +
        '</div><div class="scale-ends"><span>1 ' + D.likert[0] + "</span><span>5 " + D.likert[4] + "</span></div></div>";
    }
  });
  const last = S.page === total - 1;
  const canBack = S.page > 0 && !(pg.kind === "a" && plan.pages[S.page - 1].kind !== "a");
  const confirmQuit = S.confirmQuit
    ? '<div class="notice stack-sm" role="alertdialog" aria-label="診断の中断"><p><b>診断を中断しますか？</b> ここまでの回答は保存されず、最初の画面に戻ります。</p><div class="row"><button class="btn danger" data-act="quit-yes">中断して最初の画面に戻る</button><button class="btn" data-act="quit-no">続ける</button></div></div>'
    : "";
  return topbar(timer + '<button class="btn quiet" data-act="quit">中断する</button>') +
    '<div class="wrap"><div class="card stack">' +
    '<div class="progress"><div class="track"><div class="fill" style="width:' + Math.round((S.page / total) * 100) + '%"></div></div>' + phases + "</div>" +
    confirmQuit +
    "<div>" + body + "</div>" +
    '<div class="pager"><button class="btn" data-act="back"' + (canBack ? "" : " hidden") + '>戻る</button><button class="btn primary" data-act="' + (last ? "submit" : "next") + '" id="btn-next"' + (pageComplete() ? "" : " disabled") + ">" + (last ? "回答を送信する" : "次へ") + "</button></div>" +
    "</div></div>";
}

function renderSending() {

function renderDone() {

    ? "この診断は、すでに受検済みです。再受検が必要な場合は、採用担当者にご連絡ください。"

/* timer */
function remaining() { return Math.max(0, Math.ceil((App.state.deadline - Date.now()) / 1000)); }
function fmtClock(s) { return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function startTimer() {
  const S = App.state;
  if (!S.deadline) S.deadline = Date.now() + D.ability[S.track].limit * 1000;
  if (timerId) return;
  timerId = setInterval(() => {
    const r = remaining(), el = $("#timer");
    if (el) { el.textContent = fmtClock(r); el.classList.toggle("low", r <= 60); }
    if (r <= 0) { clearInterval(timerId); timerId = null; submitAnswers(true); }
  }, 1000);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

async function submitAnswers(timedOut) {
  const S = App.state;
  if (S.busy) return;
  S.busy = true; stopTimer(); S.view = "sending"; render();
  const plan = S.plan;
  const secs = S.deadline ? Math.min(D.ability[S.track].limit, D.ability[S.track].limit - remaining()) : 0;
  const raw = (arr, n) => Array.from({ length: n }, (_, i) => (arr[i] == null ? "-" : arr[i])).join("");
  const doc = {
    name: S.name.trim(), ident: S.ident.trim(), track: S.track, at: Date.now(), sample: false, preview: App.isAdmin,
    p: scoreScale(plan.p, S.ans.p, D.personalityDims.map((d) => d.k)),
    c: scoreScale(plan.c, S.ans.c, cultureDimsFor(S.track).map((d) => d.k)),
    ab: Object.assign(scoreAbility(plan.a, S.ans.a), { secs, timedOut: !!timedOut }),
    raw: { p: raw(S.ans.p, plan.p.length), c: raw(S.ans.c, plan.c.length), a: raw(S.ans.a, plan.a.length) }
  };
  try {
    await App.caps.db.doc("results/" + App.uid).set(doc);
    S.busy = false; S.view = "done"; S.already = false;
  } catch (e) {
    S.busy = false; S.view = "error";
    S.err = e && e.code === "quota_exceeded" ? "保存の上限に達しています。採用担当者にご連絡ください。" : "通信に失敗しました。回答は画面に残っています。もう一度お試しください。";
  }
  render();
}

function candidateClick(act, el) {
  const S = App.state;
  if (act === "track") { S.track = el.dataset.v; render(); return true; }
  if (act === "start") {
    S.plan = buildPlan(S.track); S.page = 0; S.ans = { p: [], c: [], a: [] }; S.deadline = 0; S.view = "test"; render(); window.scrollTo(0, 0); return true;
  }
  if (act === "next") {
    if (!pageComplete()) return true;
    S.page++; if (S.plan.pages[S.page].kind === "a") startTimer(); render(); window.scrollTo(0, 0); return true;
  }
  if (act === "back") { S.page--; render(); window.scrollTo(0, 0); return true; }
  if (act === "submit") { if (pageComplete()) submitAnswers(false); return true; }
  if (act === "retry") { S.view = "test"; submitAnswers(false); return true; }
  if (act === "to-admin") { S.view = "admin"; stopTimer(); render(); return true; }
  if (act === "quit") { S.confirmQuit = true; render(); const b = $('[data-act="quit-no"]'); if (b) b.focus(); return true; }
  if (act === "quit-no") { S.confirmQuit = false; render(); return true; }
  if (act === "quit-yes") {
    stopTimer();
    Object.assign(S, { view: "intro", track: App.hashTrack, name: "", ident: "", page: 0, plan: null, ans: { p: [], c: [], a: [] }, deadline: 0, secs: 0, err: "", busy: false, confirmQuit: false });
    render(); window.scrollTo(0, 0); return true;
  }
  return false;
}

function candidateInput(e) {

  const s = $("#btn-start"); if (s) s.disabled = !(S.track && S.name.trim() && S.ident.trim() && App.caps.db && App.uid);
}

    '<button class="btn quiet" data-act="close-detail" aria-label="詳細を閉じる">閉じる</button></div>' +
    '<div class="row"><span class="chip accent">' + esc((D.tracks[r.track] || {}).label || "") + "</span>" + tagsFor(r) + '<span class="muted small num">' + fmtDate(r.at) + "</span></div>" +
    '<div class="row"><div class="grow"><div class="muted small">能力検査</div><div class="stat" style="font-size:22px">' + abilityTotal(r) + " / " + abilityMax(r) + '</div></div><div class="grow"><div class="muted small">目標プロフィールとの近さ</div><div class="stat ' + fitClass(f) + '" style="font-size:22px">' + (f == null ? "-" : f) + "</div></div></div>" +
    "<h3>能力" + (ab.timedOut ? ' <span class="chip warn">時間切れ</span>' : "") + ' <span class="muted small num">所要 ' + fmtSecs(ab.secs || 0) + "</span></h3>" + '<div class="bars">' + abRows + "</div>" +
    "<h3>性格（0〜100）</h3>" + '<div class="bars">' + pRows + "</div>" +
    "<h3>価値観・カルチャー</h3>" + '<div class="legend"><span><i></i>本人の回答</span><span><i class="t"></i>目標</span></div><div class="bars">' + cRows + "</div>" +
    '<div class="notice">設問は、性格が公開尺度の日本語訳、価値観と能力が自作です。いずれも入社後の活躍との関連は検証されていません。面接を補う参考情報として使い、合否の判断はこの結果だけで行わないでください。</div>' +
    '<div class="row">' + (confirming
      ? '<span class="small">この結果を削除します。元に戻せません。</span><button class="btn danger" data-act="del-yes" data-id="' + esc(r.id) + '">削除する</button><button class="btn" data-act="del-no">やめる</button>'
      : '<button class="btn danger" data-act="del" data-id="' + esc(r.id) + '">この結果を削除</button>') + "</div></div>";
}

function resultsTab() {
  const A = App.admin, all = App.results;
  if (all == null) return '<div class="card empty"><p>読み込んでいます</p></div>';
  const list = all.filter((r) => A.filter === "all" || r.track === A.filter);
  const sel = list.find((r) => r.id === A.sel);
  const bar = '<div class="row between" style="margin-bottom:14px"><div class="seg" role="group" aria-label="区分で絞り込み">' +
    [["all", "すべて"], ["shinsotsu", "新卒"], ["chuto", "中途"]].map((x) => '<button data-act="filter" data-v="' + x[0] + '" aria-pressed="' + (A.filter === x[0]) + '">' + x[1] + "</button>").join("") + "</div>" +
    '<button class="btn" data-act="csv"' + (list.length ? "" : " disabled") + ">CSVで書き出す</button></div>";
  if (!list.length) {
    return bar + '<div class="card flat empty"><h3>まだ受検結果がありません</h3><p>候補者が検査を送信すると、ここに一覧が表示されます。まずは「受検画面を試す」で一度受けてみると、結果の見え方を確認できます。</p></div>';
  }
  const rows = list.map((r) => {
    const f = fitScore(r);
    return '<tr data-act="select" data-id="' + esc(r.id) + '" aria-selected="' + (r.id === A.sel) + '"><td class="num small">' + fmtDate(r.at) + "</td><td>" + esc(r.name || "（氏名なし）") + tagsFor(r) + "</td><td>" + esc((D.tracks[r.track] || {}).short || "") + '</td><td class="r stat">' + abilityTotal(r) + "/" + abilityMax(r) + '</td><td class="r stat ' + fitClass(f) + '">' + (f == null ? "-" : f) + "</td></tr>";
  }).join("");
  const table = '<div class="card tablewrap" style="padding:8px"><table><thead><tr><th>受検日時</th><th>氏名</th><th>区分</th><th class="r">能力</th><th class="r">近さ</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  return bar + '<div class="split"><div>' + table + "</div><div>" + (sel ? detailHtml(sel) : '<div class="card flat empty"><p>一覧から候補者を選ぶと、詳細が表示されます。</p></div>') + "</div></div>";
}

function targetTab() {
  const A = App.admin;
  if (!A.draftTarget) A.draftTarget = JSON.parse(JSON.stringify({ shinsotsu: targetFor("shinsotsu"), chuto: targetFor("chuto") }));
  const block = (track) => '<div class="card stack"><h2>' + D.tracks[track].label + "</h2>" + cultureDimsFor(track).map((d) => {
    const v = A.draftTarget[track][d.k];
    return '<div class="stack-sm"><div><label for="t-' + track + "-" + d.k + '"><b>' + d.name + '</b></label><div class="muted small">' + d.note + '</div></div><div class="slider-row"><input type="range" min="0" max="100" step="5" id="t-' + track + "-" + d.k + '" data-track="' + track + '" data-dim="' + d.k + '" value="' + v + '"><span class="stat" id="tv-' + track + "-" + d.k + '">' + v + "</span></div></div>";
  }).join("") + "</div>";
  return '<div class="stack"><p class="muted">自社が求める傾向を、0（弱い）から100（強い）で設定します。受検者の価値観との差が小さいほど、結果画面の「近さ」が高くなります。設定は保存後すぐに、過去の結果にも反映されます。</p>' +
    '<div class="split">' + block("shinsotsu") + block("chuto") + "</div>" +
    '<div class="row"><button class="btn primary" data-act="save-target">目標を保存</button><button class="btn" data-act="reset-target">初期値に戻す</button></div></div>';
}

function guideTab() {
  return '<div class="split"><div class="card stack"><h2>受検してもらう手順</h2>' +
    "<p>このページのリンクを候補者に共有します。候補者は氏名と受検IDを入力し、性格・価値観・能力の順に回答します。回答は送信と同時に、この画面の一覧に追加されます。</p>" +
    '<p>リンクの末尾に <span class="num">#shinsotsu</span>（新卒）または <span class="num">#chuto</span>（中途）を付けると、受検区分があらかじめ決まった状態で開きます。</p>' +
    '<div class="notice">回答を保存するには、候補者が共有メニューで「閲覧のみ」より上の権限（Contributor）でこのページを開ける必要があります。権限が閲覧のみだと、回答は送信できません。</div></div>' +
    '<div class="card stack"><h2>運用上の注意</h2>' +
    "<p>結果は、面接を補う参考情報です。入社後の成果との関連は、まだ検証されていません。</p>" +
    "<p>性格の設問は、パブリックドメインのIPIP（International Personality Item Pool）のビッグファイブ設問から20問を選び、日本語に訳したものです。翻訳の確認は済んでいません。価値観と能力の設問は自作です。</p>" +
    "<p>性別、年齢、出身などで不利にならないか、職務と関係のない設問がないかを、実施前に確認してください。性格の結果を、心身の状態の判断に使わないでください。</p>" +
    "<p>氏名や回答は個人情報です。利用目的の説明、閲覧できる人の限定、保管期間の設定が必要です。不要になった結果は、詳細画面から削除できます。</p></div></div>";
}

function renderAdmin() {
  const A = App.admin;
  const body = A.tab === "results" ? resultsTab() : A.tab === "target" ? targetTab() : guideTab();
  return '<div class="wrap wide">' + adminTopbar() + "<h1 style=\"margin-bottom:16px\">採用診断の管理</h1>" + tabsHtml() + body + "</div>";
}

/* CSV export */
function csvCell(v) {
  if (v == null) return "";
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
async function exportCsv() {
  const list = App.results.filter((r) => App.admin.filter === "all" || r.track === App.admin.filter);
  const head = ["受検日時", "氏名", "受検ID", "区分", "種別", "言語", "論理", "数的", "能力合計", "能力満点", "所要秒", "時間切れ"]
    .concat(D.personalityDims.map((d) => d.name), ALL_CULTURE.map((d) => d.name), ["目標との近さ"]);
  const rows = list.map((r) => {
    const ab = r.ab || { s: [], n: [], secs: 0 };
    return [fmtDate(r.at), r.name, r.ident, (D.tracks[r.track] || {}).short, r.sample ? "サンプル" : r.preview ? "テスト" : "本番", ab.s[0], ab.s[1], ab.s[2], abilityTotal(r), abilityMax(r), ab.secs, ab.timedOut ? "はい" : ""]
      .concat(D.personalityDims.map((d) => (r.p || {})[d.k]), ALL_CULTURE.map((d) => (r.c || {})[d.k]), [fitScore(r)]);
  });
  const text = "﻿" + [head].concat(rows).map((row) => row.map(csvCell).join(",")).join("\r\n");
  if (!App.caps.downloads) { toast("この環境ではファイルを保存できません"); return; }
  try {
    await App.caps.downloads.save({ filename: "適性診断_結果_" + new Date().toISOString().slice(0, 10) + ".csv", data: text });
    toast("CSVを書き出しました");
  } catch (e) { if (!e || e.code !== "declined") toast("書き出せませんでした"); }
}

async function saveTarget() {
  try {
    await App.caps.db.doc("config/target").set(JSON.parse(JSON.stringify(App.admin.draftTarget)));
    toast("目標プロフィールを保存しました");
  } catch (e) { toast("保存できませんでした。もう一度お試しください"); }
}

async function deleteResult(id) {
  try { await App.caps.db.doc("results/" + id).delete(); App.admin.confirmDel = null; if (App.admin.sel === id) App.admin.sel = null; toast("削除しました"); }
  catch (e) { toast("削除できませんでした"); }
  render();
}

function adminClick(act, el) {
  const A = App.admin;
  if (act === "tab") { A.tab = el.dataset.v; render(); return true; }
  if (act === "filter") { A.filter = el.dataset.v; render(); return true; }
  if (act === "select") { A.sel = el.dataset.id; A.confirmDel = null; render(); return true; }
  if (act === "close-detail") { A.sel = null; render(); return true; }
  if (act === "csv") { exportCsv(); return true; }
  if (act === "del") { A.confirmDel = el.dataset.id; render(); return true; }
  if (act === "del-no") { A.confirmDel = null; render(); return true; }
  if (act === "del-yes") { deleteResult(el.dataset.id); return true; }
  if (act === "save-target") { saveTarget(); return true; }
  if (act === "reset-target") { A.draftTarget = JSON.parse(JSON.stringify(D.defaultTarget)); render(); toast("初期値に戻しました。保存すると反映されます"); return true; }
  if (act === "preview") {
    const S = App.state; S.view = "intro"; S.track = App.hashTrack || S.track; render(); window.scrollTo(0, 0); return true;
  }
  return false;
}

function adminInput(e) {
  const t = e.target;
  if (t.type === "range" && t.dataset.dim) {
    const v = Number(t.value); App.admin.draftTarget[t.dataset.track][t.dataset.dim] = v;
    const o = $("#tv-" + t.dataset.track + "-" + t.dataset.dim); if (o) o.textContent = v;
  }
}

/* Main: rendering switch, events, admin subscriptions, startup. */
App.hashTrack = ["shinsotsu", "chuto"].indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : null;

function render() {
  const v = App.state.view;
  let html;
  if (v === "loading") html = '<div class="wrap"><div class="card empty"><p>読み込んでいます</p></div></div>';
  else if (v === "admin") html = renderAdmin();
  else if (v === "intro") html = renderIntro();
  else if (v === "test") html = renderTest();
  else if (v === "sending") html = renderSending();
  else if (v === "error") html = renderError();
  else html = renderDone();
  $("#app").innerHTML = html;
}

function subscribeAdmin() {
  const db = App.caps.db;
  if (!db) { App.results = []; return; }
  db.collection("results").orderBy("at", "desc").limit(500).onSnapshot(
    (snap) => { App.results = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (App.state.view === "admin") render(); },
    () => { App.results = []; if (App.state.view === "admin") render(); }
  );
  db.doc("config/target").onSnapshot(
    (s) => {
      if (s.exists) App.target = s.data();
      if (App.admin.tab !== "target") App.admin.draftTarget = null;
      if (App.state.view === "admin") render();
    },
    () => {}
  );
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (candidateClick(act, el)) return;
  adminClick(act, el);
});
document.addEventListener("input", (e) => { candidateInput(e); adminInput(e); });
document.addEventListener("change", (e) => { if (e.target.type === "radio") candidateInput(e); });

(async function start() {
  render();
  await initCaps();
  const S = App.state;
  S.track = App.hashTrack;
  if (App.isAdmin) {
    S.view = "admin"; App.results = null; subscribeAdmin();
  } else {
    S.view = "intro";
    if (App.caps.db && App.uid) {
      try {
        const s = await App.caps.db.doc("results/" + App.uid).get();
        if (s.exists) { S.view = "done"; S.already = true; }
      } catch (e) { /* the intro still works; submit reports any problem */ }
    }
  }
  render();
})();

</script>
